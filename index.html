<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Performance Center</title><style> *{box-sizing:border-box}body{margin:0;background:#10131b;color:#edf0f8;font:16px system-ui}main{max-width:760px;margin:auto;padding:22px 16px 80px}h1{font-size:29px;margin:8px 0}h2{font-size:21px}small,p{color:#aab3c5}nav{display:flex;gap:6px;flex-wrap:wrap;margin:20px 0}button,input,select,textarea{font:inherit;border:1px solid #394154;border-radius:10px;padding:10px;background:#202635;color:#fff}button{cursor:pointer}button.active,.primary{background:#b9ef70;color:#14200a;border-color:#b9ef70;font-weight:700}section,.card{background:#191e29;border:1px solid #2c3444;border-radius:16px;padding:18px;margin:12px 0}label{display:block;margin:13px 0 5px}input:not([type=checkbox]),select,textarea{width:100%}input[type=range]{accent-color:#b9ef70;padding:0}input[type=checkbox]{width:22px;height:22px;accent-color:#b9ef70}.line{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:#aab3c5;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{font-size:26px;font-weight:bold;color:#b9ef70}svg{width:100%;height:auto} .habit{padding:12px 0;border-bottom:1px solid #343b49} .primary{margin-top:14px;width:100%} .hidden{display:none} </style><main><small>ATHLETE / DEVELOPMENT</small><h1>Performance Center</h1><p>Dein Fortschritt. Dein Rhythmus.</p><nav id="nav"></nav><div class="line"><label for="day">Datum</label><input id="day" type="date" style="width:auto"></div><div id="app"></div><p id="msg" role="status"></p></main><script>
const $=id=>document.getElementById(id), today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};let data={logs:{},habits:[],checks:{},tests:[],mental:{},goals:[]};let session=null, busy=false;const base='https://mfqibdtiyqqlcwqddhub.supabase.co',key='sb_publishable_yATqsV9JfVVU5WomrUHLpA_6cfs0RfJ';async function req(path,method='GET',body,extra={}){let r=await fetch(base+path,{method,headers:{apikey:key,'Content-Type':'application/json',...(session?{Authorization:'Bearer '+session.access_token}:{}),...extra},...(body===undefined?{}:{body:JSON.stringify(body)})});if(!r.ok)throw Error('Serverfehler '+r.status);return r.status===204?null:await r.json().catch(()=>null)}async function login(){if(busy)return;busy=true;try{session=await req('/auth/v1/token?grant_type=password','POST',{email:$('email').value,password:$('pw').value});let rows=await req('/rest/v1/performance_entries?id=eq.'+session.user.id+'&select=data');if(rows.length)data={...data,...rows[0].data};$('pw').value='';render();$('msg').textContent='Angemeldet. Cloud-Daten geladen.'}catch(e){session=null;$('msg').textContent='Anmeldung oder Laden fehlgeschlagen: '+e.message}finally{busy=false}}function logout(){if(busy)return;session=null;data={logs:{},habits:[],checks:{},tests:[],mental:{},goals:[]};render();$('msg').textContent='Abgemeldet.'}let tab='Dashboard',period=30;const fields=['Körpergefühl','Fitnessgefühl','Beine – Frische','Beine – Explosivität','Energie','Schlafqualität','Regenerationsgefühl','Motivation','Mentale Verfassung','Stressfreiheit','Muskelbeschwerden – Beschwerdefreiheit'];const types={'CMJ':'cm','Standweitsprung':'cm','10-m-Sprint':'s','20-m-Sprint':'s'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let queue=Promise.resolve();function save(){if(!session)return;let snapshot=JSON.parse(JSON.stringify(data)),uid=session.user.id;busy=true;$('msg').textContent='Speichert …';queue=queue.catch(()=>{}).then(async()=>{try{if(session.expires_at*1000<Date.now()+60000){let token=session.refresh_token;session=await req('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:token})}await req('/rest/v1/performance_entries','POST',{id:uid,user_id:uid,entry_date:today(),category:'settings',data:snapshot},{Prefer:'resolution=merge-duplicates,return=minimal'});$('msg').textContent='In Cloud gespeichert.'}catch(e){$('msg').textContent='NICHT gespeichert. Verbindung prüfen und erneut speichern.'}finally{busy=false}})}function date(){return $('day').value} $('day').value=today();$('day').onchange=render;function switchTab(t){tab=t;render()}function chart(points,unit=''){if(!points.length)return '<p>Noch keine Daten vorhanden.</p>';let vals=points.map(p=>p[1]),lo=Math.min(...vals),hi=Math.max(...vals);if(lo===hi){lo-=1;hi+=1}let xy=points.map((p,i)=>[44+(points.length===1?140:i*280/(points.length-1)),110-(p[1]-lo)/(hi-lo)*90]);return `<svg viewBox="0 0 350 150" role="img" aria-label="Verlaufsdiagramm"><path d="M44 15 V110 H330" stroke="#69748a" fill="none"/><text x="0" y="22" fill="#aab3c5" font-size="10">${hi.toFixed(1)}</text><text x="0" y="110" fill="#aab3c5" font-size="10">${lo.toFixed(1)}</text><polyline points="${xy.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#b9ef70" stroke-width="2"/>${xy.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#b9ef70"><title>${esc(points[i][0])}: ${points[i][1]} ${esc(unit)}</title></circle>`).join('')}<text x="44" y="137" fill="#aab3c5" font-size="10">${esc(points[0][0])}</text><text x="330" y="137" text-anchor="end" fill="#aab3c5" font-size="10">${esc(points.at(-1)[0])}</text></svg><small>Letzter Wert: ${vals.at(-1).toFixed(1)} ${esc(unit)}</small>`}function render(){if(!session){$('nav').innerHTML='';$('app').innerHTML='<section><h2>Privater Zugang</h2><label>E-Mail</label><input id="email" type="email" autocomplete="username"><label>Passwort</label><input id="pw" type="password" autocomplete="current-password"><button class="primary" onclick="login()">Anmelden</button></section>';return;} $('nav').innerHTML=['Dashboard','Daily Log','Mental','Tests','Habits','Ziele'].map(t=>`<button class="${tab===t?'active':''}" onclick="switchTab('${t}')">${t}</button>`).join('');let l=data.logs[date()]||{},a=$('app');if(tab==='Daily Log'){a.innerHTML=`<section><h2>Wie geht es dir heute?</h2><p>1 = sehr schlecht · 10 = optimal. Nicht bewertete Felder bleiben leer.</p>${fields.map((f,i)=>`<label class="line">${f}<b id="v${i}">${l[f]??'–'}</b></label><input type="range" min="1" max="10" value="${l[f]??5}" id="r${i}" oninput="this.dataset.used=1;document.getElementById('v${i}').textContent=this.value" ${l[f]!=null?'data-used="1"':''}><button style="padding:3px 8px;font-size:12px" onclick="document.getElementById('r${i}').dataset.used=1;document.getElementById('v${i}').textContent=document.getElementById('r${i}').value">Wert übernehmen</button>`).join('')}<div class="grid">${[['sleep','Schlaf (h)'],['hrv','HRV (ms)'],['pulse','Ruhepuls (bpm)'],['weight','Gewicht (kg)'],['duration','Training (min)'],['rpe','Belastung RPE (0–10)']].map(([k,n])=>`<div><label>${n}</label><input id="${k}" type="number" min="0" ${k==='rpe'?'max="10"':''} step="any" value="${esc(l[k])}"></div>`).join('')}</div><label>Notiz (optional)</label><textarea id="note" rows="3">${esc(l.note)}</textarea><button class="primary" onclick="logSave()">Daily Log speichern</button></section>`}else if(tab==='Tests'){a.innerHTML=`<section><h2>Leistungstest erfassen</h2><p>CMJ wöchentlich, Sprints alle 2–4 Wochen. Möglichst gleiche Bedingungen und erholte Beine.</p><label>Test</label><select id="type" onchange="$('custom').classList.toggle('hidden',this.value!=='Eigener Test')">${[...Object.keys(types),'Eigener Test'].map(t=>`<option>${t}</option>`).join('')}</select><div id="custom" class="hidden"><label>Testname</label><input id="customName"><label>Einheit</label><input id="unit"><label>Besserer Wert</label><select id="direction"><option value="high">Höher</option><option value="low">Tiefer</option></select></div><label>Ergebnis (cm bzw. Sekunden beim Sprint)</label><input id="result" type="number" step="any" min="0"><label>Notiz / Bedingungen</label><input id="testnote"><button class="primary" onclick="testSave()">Test speichern</button></section><section><h2>Testhistorie</h2>${data.tests.slice().reverse().map(t=>`<div class="habit">${esc(t.date)} · <b>${esc(t.name)}: ${t.value} ${esc(t.unit)}</b><p>${esc(t.note)}</p><button onclick="removeTest('${t.id}')">Löschen</button></div>`).join('')||'<p>Noch keine Tests.</p>'}</section>` }else if(tab==='Mental'){let m=data.mental[date()]||{};a.innerHTML=`<section><h2>Mental Performance</h2><p>Freiwillig · 1 bis 10 · keine Erfolgsnote</p>${mentalFields.map((f,i)=>`<label>${f}</label><select id="m${i}"><option value="">Nicht bewertet</option>${Array.from({length:10},(_,j)=>`<option ${m[f]===j+1?'selected':''}>${j+1}</option>`).join('')}</select>`).join('')}<label>Was ist mir heute mental gelungen?</label><textarea id="mn">${esc(m.note)}</textarea><button class="primary" onclick="mentalSave()">Speichern</button></section>`}else if(tab==='Ziele'){a.innerHTML=`<section><h2>30- und 90-Tage-Ziele</h2><input id="gn" placeholder="Mein Ziel"><label>Zeitraum</label><select id="gd"><option>30</option><option>90</option></select><button class="primary" onclick="goalAdd()">Ziel hinzufügen</button>${data.goals.map((g,i)=>`<div class="habit"><b>${esc(g.name)}</b><p>${esc(g.start)} · ${g.days} Tage</p><label><input type="checkbox" ${g.done?'checked':''} onchange="goalDone(${i},this.checked)"> Erreicht</label></div>`).join('')}</section>`}else if(tab==='Habits'){a.innerHTML=`<section><h2>Deine Gewohnheiten</h2><label>Neue Gewohnheit</label><input id="habitName" placeholder="z. B. 10 Minuten Mobility"><button class="primary" onclick="addHabit()">Habit hinzufügen</button>${data.habits.filter(h=>!h.end||date()<h.end).filter(h=>h.start<=date()).map(h=>`<div class="line habit"><label class="line"><input type="checkbox" ${data.checks[date()]?.[h.id]?'checked':''} onchange="checkHabit('${h.id}',this.checked)">${esc(h.name)}</label><button onclick="archiveHabit('${h.id}')">Archivieren</button></div>`).join('')}</section>`}else{let end=new Date(date()+'T12:00:00'),start=new Date(end);start.setDate(start.getDate()-period+1);let from=start.toISOString().slice(0,10), logs=Object.entries(data.logs).filter(([d])=>d>=from&&d<=date()).sort();let days=Array.from({length:period},(_,i)=>{let d=new Date(start);d.setDate(d.getDate()+i);return d.toISOString().slice(0,10)});let hp=days.map(d=>{let hs=data.habits.filter(h=>h.start<=d&&(!h.end||d<h.end));return [d,hs.length?100*hs.filter(h=>data.checks[d]?.[h.id]).length/hs.length:null]}).filter(p=>p[1]!=null);a.innerHTML=`<section><h2>Deine Entwicklung</h2><div class="line">${[7,30,90].map(n=>`<button class="${period===n?'active':''}" onclick="period=${n};render()">${n} Tage</button>`).join('')}</div><p>${logs.length} Daily Logs im Zeitraum</p></section>${[...fields,'sleep','hrv','pulse','weight'].map(f=>`<section><h2>${esc(({sleep:'Schlafdauer',hrv:'HRV',pulse:'Ruhepuls',weight:'Gewicht'})[f]||f)}</h2>${chart(logs.filter(([d,l])=>l[f]!=null).map(([d,l])=>[d,l[f]]))}</section>`).join('')}<section><h2>Habit-Erfüllung (%)</h2>${chart(hp,'%')}${data.habits.map(h=>{let ds=days.filter(d=>d>=h.start&&(!h.end||d<h.end));return `<p>${esc(h.name)}: ${ds.filter(d=>data.checks[d]?.[h.id]).length}/${ds.length} Tage</p>`}).join('')}</section>${[...new Set(data.tests.map(t=>JSON.stringify([t.name,t.unit,t.direction])))].map(k=>{let [n,u,dir]=JSON.parse(k),all=data.tests.filter(t=>t.name===n&&t.unit===u&&t.direction===dir),ts=all.filter(t=>t.date>=from&&t.date<=date()).sort((a,b)=>a.date.localeCompare(b.date));return `<section><h2>${esc(n)}</h2><div class="stat">${dir==='low'?Math.min(...all.map(t=>t.value)):Math.max(...all.map(t=>t.value))} ${esc(u)}</div><small>Persönliche Bestleistung (alle Einträge)</small>${chart(ts.map(t=>[t.date,t.value]),u)}</section>`}).join('')}${mentalFields.map(f=>`<section><h2>${f}</h2>${chart(Object.entries(data.mental).filter(([d,m])=>d>=from&&d<=date()&&m[f]!=null).sort().map(([d,m])=>[d,m[f]]))}</section>`).join('')}<section><h2>Datensicherung</h2><button onclick="logout()">Abmelden</button><button onclick="backup()">Daten exportieren</button><label>Backup importieren (ersetzt aktuelle Daten)</label><input type="file" accept=".json" onchange="restore(this)"></section>`}}
const mentalFields=['Mentale Ruhe','Umgang mit belastenden Gedanken','Selbstvertrauen','Konzentration','Umgang mit Herausforderungen'];function mentalSave(){let m={note:$('mn').value};mentalFields.forEach((f,i)=>{if($('m'+i).value)m[f]=+$('m'+i).value});data.mental[date()]=m;save()}function goalAdd(){let name=$('gn').value.trim();if(!name)return;data.goals.push({name,start:date(),days:+$('gd').value,done:false});save();render()}function goalDone(i,v){data.goals[i].done=v;save();if(v)alert('Ziel erreicht!')}function logSave(){let l={};fields.forEach((f,i)=>{let r=$('r'+i);if(r.dataset.used)l[f]=+r.value});for(let k of ['sleep','hrv','pulse','weight','duration','rpe']){let e=$(k);if(!e.checkValidity()){e.reportValidity();return}if(e.value!=='')l[k]=+e.value}l.note=$('note').value;data.logs[date()]=l;save()}function testSave(){let n=$('type').value,c=n==='Eigener Test',v=+$('result').value,u=c?$('unit').value.trim():types[n];if(c)n=$('customName').value.trim();if(!n||!u||!Number.isFinite(v)||v<=0){$('msg').textContent='Bitte Testname, Einheit und gültigen Wert eingeben.';return}data.tests.push({id:Date.now().toString(),date:date(),name:n,unit:u,value:v,direction:c?$('direction').value:u==='s'?'low':'high',note:$('testnote').value});save();render()}function removeTest(id){if(confirm('Test löschen?')){data.tests=data.tests.filter(t=>t.id!==id);save();render()}}function addHabit(){let n=$('habitName').value.trim();if(!n)return;data.habits.push({id:Date.now().toString(),name:n,start:date()});save();render()}function checkHabit(id,v){(data.checks[date()]??={})[id]=v;save()}function archiveHabit(id){if(confirm('Habit ab diesem Datum archivieren?')){data.habits.find(h=>h.id===id).end=date();save();render()}}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='performance-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}async function restore(e){try{let d=JSON.parse(await e.files[0].text());if(!d.logs||!d.checks||!Array.isArray(d.habits)||!Array.isArray(d.tests))throw Error();if(confirm('Aktuelle Daten ersetzen?')){data=d;save();render()}}catch{$('msg').textContent='Ungültiges Backup.'}}render();</script></html>
